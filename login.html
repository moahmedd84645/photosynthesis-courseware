<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة الدخول | منصة مختبر البناء الضوئي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl shadow-xl shadow-slate-200/50 p-8 space-y-6">
    
    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="w-14 h-14 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-600 flex items-center justify-center mx-auto shadow-sm">
        <i data-lucide="microscope" class="w-7 h-7"></i>
      </div>
      <h1 class="text-xl font-black text-slate-900">مختبر البناء الضوئي التفاعلي</h1>
      <p class="text-xs text-slate-500 font-medium">سجل دخولك لحفظ مسارك التعليمي واعتماد شهادتك</p>
    </div>

    <!-- Role Switcher Tabs -->
    <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-2xl border border-slate-200">
      <button id="roleStudentBtn" class="py-2 rounded-xl text-xs font-bold transition-all bg-white text-emerald-700 shadow-sm border border-slate-200 flex items-center justify-center space-x-1.5 space-x-reverse">
        <i data-lucide="graduation-cap" class="w-4 h-4"></i>
        <span>بوابة الطالب</span>
      </button>
      <button id="roleTeacherBtn" class="py-2 rounded-xl text-xs font-bold transition-all text-slate-500 hover:text-slate-800 flex items-center justify-center space-x-1.5 space-x-reverse">
        <i data-lucide="shield" class="w-4 h-4"></i>
        <span>بوابة المعلم</span>
      </button>
    </div>

    <!-- Auth Form -->
    <form id="authForm" class="space-y-4">
      <div id="nameFieldGroup">
        <label class="block text-xs font-bold text-slate-700 mb-1">اسم الطالب الرباعي (لإصدار الشهادة):</label>
        <div class="relative">
          <input type="text" id="nameInput" placeholder="مثال: أحمد محمد علي" class="w-full pl-4 pr-10 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-xs text-slate-800 focus:outline-none focus:border-emerald-500 focus:bg-white transition-all">
          <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute right-3 top-3"></i>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">البريد الإلكتروني:</label>
        <div class="relative">
          <input type="email" id="emailInput" required placeholder="user@school.edu" class="w-full pl-4 pr-10 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-xs text-slate-800 focus:outline-none focus:border-emerald-500 focus:bg-white transition-all">
          <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute right-3 top-3"></i>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">كلمة المرور:</label>
        <div class="relative">
          <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full pl-4 pr-10 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-xs text-slate-800 focus:outline-none focus:border-emerald-500 focus:bg-white transition-all">
          <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute right-3 top-3"></i>
        </div>
      </div>

      <!-- Adaptive Learning Track Selection for Students -->
      <div id="trackSelectionGroup" class="space-y-1.5 pt-1">
        <label class="block text-xs font-bold text-slate-700">المسار التعليمي المستهدف:</label>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <label class="flex items-center space-x-2 space-x-reverse p-2.5 rounded-xl border border-emerald-500 bg-emerald-50/50 cursor-pointer">
            <input type="radio" name="learningTrack" value="standard" checked class="accent-emerald-600">
            <span class="font-semibold text-emerald-900">تأسيسي شامل</span>
          </label>
          <label class="flex items-center space-x-2 space-x-reverse p-2.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 cursor-pointer">
            <input type="radio" name="learningTrack" value="advanced" class="accent-emerald-600">
            <span class="font-semibold text-slate-700">تحدي المتفوقين</span>
          </label>
        </div>
      </div>

      <div class="pt-2 flex flex-col space-y-2">
        <button type="submit" id="submitBtn" class="btn-emerald w-full py-3 rounded-xl font-bold text-xs flex items-center justify-center space-x-1.5 space-x-reverse shadow-md shadow-emerald-600/20">
          <span>دخول / إنشاء حساب</span>
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
        </button>

        <button type="button" id="guestBtn" class="w-full py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600 font-semibold text-xs flex items-center justify-center space-x-1.5 space-x-reverse transition-colors">
          <i data-lucide="sparkles" class="w-4 h-4 text-emerald-600"></i>
          <span>تجربة سريعة كطالب ضيف</span>
        </button>
      </div>
    </form>

    <div class="text-center pt-2 border-t border-slate-100 text-[11px] text-slate-400">
      منصة تعليمية قائمة على الويب مدعومة بنظام Firebase السحابي
    </div>

  </div>

  <script type="module">
    import { auth, db, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInAnonymously, doc, setDoc, getDoc } from './js/firebase-config.js';
    lucide.createIcons();

    let activeRole = 'student'; // 'student' or 'teacher'

    const roleStudentBtn = document.getElementById('roleStudentBtn');
    const roleTeacherBtn = document.getElementById('roleTeacherBtn');
    const nameFieldGroup = document.getElementById('nameFieldGroup');
    const trackSelectionGroup = document.getElementById('trackSelectionGroup');
    const authForm = document.getElementById('authForm');
    const guestBtn = document.getElementById('guestBtn');

    roleStudentBtn.addEventListener('click', () => {
      activeRole = 'student';
      roleStudentBtn.className = 'py-2 rounded-xl text-xs font-bold transition-all bg-white text-emerald-700 shadow-sm border border-slate-200 flex items-center justify-center space-x-1.5 space-x-reverse';
      roleTeacherBtn.className = 'py-2 rounded-xl text-xs font-bold transition-all text-slate-500 hover:text-slate-800 flex items-center justify-center space-x-1.5 space-x-reverse';
      nameFieldGroup.classList.remove('hidden');
      trackSelectionGroup.classList.remove('hidden');
      guestBtn.classList.remove('hidden');
    });

    roleTeacherBtn.addEventListener('click', () => {
      activeRole = 'teacher';
      roleTeacherBtn.className = 'py-2 rounded-xl text-xs font-bold transition-all bg-white text-amber-700 shadow-sm border border-slate-200 flex items-center justify-center space-x-1.5 space-x-reverse';
      roleStudentBtn.className = 'py-2 rounded-xl text-xs font-bold transition-all text-slate-500 hover:text-slate-800 flex items-center justify-center space-x-1.5 space-x-reverse';
      nameFieldGroup.classList.add('hidden');
      trackSelectionGroup.classList.add('hidden');
      guestBtn.classList.add('hidden');
    });

    guestBtn.addEventListener('click', async () => {
      try {
        await signInAnonymously(auth);
        localStorage.setItem('student_name', 'طالب مستكشف (ضيف)');
        localStorage.setItem('student_track', 'standard');
        window.location.href = 'index.html';
      } catch (err) {
        console.error(err);
        window.location.href = 'index.html';
      }
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const name = document.getElementById('nameInput').value.trim() || 'طالب متميز';
      const track = document.querySelector('input[name="learningTrack"]:checked')?.value || 'standard';

      try {
        let userCred;
        try {
          userCred = await signInWithEmailAndPassword(auth, email, password);
        } catch (signInErr) {
          // If not exist, register
          userCred = await createUserWithEmailAndPassword(auth, email, password);
        }

        const user = userCred.user;
        localStorage.setItem('student_name', name);
        localStorage.setItem('student_track', track);
        localStorage.setItem('user_role', activeRole);

        // Store in Firestore
        await setDoc(doc(db, activeRole === 'teacher' ? 'teachers' : 'students', user.uid), {
          name: name,
          email: email,
          role: activeRole,
          track: track,
          lastLogin: new Date().toISOString()
        }, { merge: true });

        if (activeRole === 'teacher') {
          window.location.href = 'teacher.html';
        } else {
          window.location.href = 'index.html';
        }

      } catch (err) {
        alert('خطأ في تسجيل الدخول: ' + err.message);
      }
    });
  </script>
</body>
</html>
